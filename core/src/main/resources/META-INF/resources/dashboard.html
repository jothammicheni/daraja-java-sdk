<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M-Pesa Webhook Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 28px; color: #1a237e; }
        .header h1 span { font-size: 14px; color: #666; font-weight: normal; }
        .header .right { display: flex; align-items: center; gap: 15px; font-size: 13px; color: #666; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .stat-card .number { font-size: 28px; font-weight: bold; }
        .stat-card .label { color: #666; font-size: 13px; margin-top: 4px; }
        .stat-card.total .number { color: #1a237e; }
        .stat-card.success .number { color: #2e7d32; }
        .stat-card.failed .number { color: #c62828; }
        .stat-card.cancelled .number { color: #f57f17; }
        .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters button { padding: 6px 16px; border: 1px solid #ddd; border-radius: 20px; background: white; cursor: pointer; transition: all 0.2s; font-size: 13px; }
        .filters button:hover { background: #e8e8e8; }
        .filters button.active { background: #1a237e; color: white; border-color: #1a237e; }
        .filters button.danger { border-color: #c62828; color: #c62828; }
        .filters button.danger:hover { background: #c62828; color: white; }
        .filters button.primary { border-color: #1a237e; color: #1a237e; }
        .filters button.primary:hover { background: #1a237e; color: white; }
        .table-wrapper { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; color: #666; border-bottom: 2px solid #e0e0e0; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        tr:hover { background: #f8f9fa; }
        td .badge { padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; display: inline-block; }
        td .badge.SUCCESS { background: #e8f5e9; color: #2e7d32; }
        td .badge.FAILED { background: #ffebee; color: #c62828; }
        td .badge.CANCELLED { background: #fff3e0; color: #e65100; }
        td .badge.PENDING { background: #e3f2fd; color: #0d47a1; }
        td .json-btn { background: none; border: none; color: #1a237e; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 4px; }
        td .json-btn:hover { background: #e8eaf6; }
        td .timestamp { font-size: 12px; color: #999; white-space: nowrap; }
        td code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-family: monospace; }
        .details-panel { margin-top: 20px; background: #1e1e1e; border-radius: 10px; padding: 20px; display: none; position: relative; }
        .details-panel .close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .details-panel .close:hover { color: white; }
        .details-panel pre { color: #d4d4d4; overflow-x: auto; font-size: 13px; max-height: 400px; overflow-y: auto; font-family: 'Courier New', monospace; line-height: 1.6; margin: 0; }
        .details-panel .summary { color: #ccc; margin-bottom: 10px; font-size: 14px; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .empty .icon { font-size: 48px; margin-bottom: 10px; }
        .live-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: pulse 1.5s ease-in-out infinite; margin-right: 6px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .auto-refresh-text { font-size: 12px; color: #666; margin-left: 10px; }
        .json-view { font-size: 12px; color: #888; }
        @media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📨 Webhook Dashboard <span>M-Pesa Daraja SDK</span></h1>
        <div class="right">
            <span class="live-indicator"></span>
            <span id="statusText">Live</span>
            <span class="auto-refresh-text">Auto-refresh: 5s</span>
        </div>
    </div>

    <div class="stats" id="stats">
        <div class="stat-card total"><div class="number" id="totalCount">0</div><div class="label">📊 Total</div></div>
        <div class="stat-card success"><div class="number" id="successCount">0</div><div class="label">✅ Success</div></div>
        <div class="stat-card failed"><div class="number" id="failedCount">0</div><div class="label">❌ Failed</div></div>
        <div class="stat-card cancelled"><div class="number" id="cancelledCount">0</div><div class="label">🚫 Cancelled</div></div>
    </div>

    <div class="filters">
        <button class="active" data-filter="ALL">📋 All</button>
        <button data-filter="SUCCESS">✅ Success</button>
        <button data-filter="FAILED">❌ Failed</button>
        <button data-filter="CANCELLED">🚫 Cancelled</button>
        <button data-filter="PENDING">⏳ Pending</button>
        <button class="primary" onclick="refresh()">🔄 Refresh</button>
        <button class="danger" onclick="clearLogs()">🗑️ Clear</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Time</th>
                <th>Checkout ID</th>
                <th>Status</th>
                <th>Amount</th>
                <th>Phone</th>
                <th>Receipt</th>
                <th>Result Code</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="logsBody">
            <tr><td colspan="8"><div class="empty"><div class="icon">📭</div><p>No webhooks received yet</p></div></td></tr>
            </tbody>
        </table>
    </div>

    <div class="details-panel" id="detailsPanel">
        <button class="close" onclick="closeDetails()">✕</button>
        <div class="summary" id="detailsSummary">Loading...</div>
        <pre id="detailsContent">Loading...</pre>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let logs = [];
    let currentFilter = 'ALL';
    let refreshInterval = 5000;

    async function loadLogs() {
        try {
            const response = await fetch(`${API_BASE}/api/webhook-dashboard/logs?limit=200`);
            logs = await response.json();
            updateStats();
            renderTable();
            document.getElementById('statusText').textContent = 'Live';
        } catch (e) {
            document.getElementById('statusText').textContent = '⚠️ Connecting...';
            console.log('Waiting for endpoint...');
        }
    }

    function updateStats() {
        const total = logs.length;
        const success = logs.filter(l => l.status === 'SUCCESS').length;
        const failed = logs.filter(l => l.status === 'FAILED').length;
        const cancelled = logs.filter(l => l.status === 'CANCELLED').length;
        const pending = logs.filter(l => l.status === 'PENDING').length;

        document.getElementById('totalCount').textContent = total;
        document.getElementById('successCount').textContent = success;
        document.getElementById('failedCount').textContent = failed;
        document.getElementById('cancelledCount').textContent = cancelled;
    }

    function renderTable() {
        const filtered = currentFilter === 'ALL'
            ? logs
            : logs.filter(l => l.status === currentFilter);

        const tbody = document.getElementById('logsBody');

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><div class="icon">📭</div><p>No webhooks received yet</p></div></td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach(log => {
            const statusClass = log.status || 'PENDING';
            const time = new Date(log.timestamp).toLocaleString();
            html += `
                <tr>
                    <td class="timestamp">${time}</td>
                    <td><code>${log.checkoutId || 'N/A'}</code></td>
                    <td><span class="badge ${statusClass}">${statusClass}</span></td>
                    <td><strong>${log.amount || 'N/A'}</strong></td>
                    <td>${log.maskedPhoneNumber || log.phoneNumber || 'N/A'}</td>
                    <td><code>${log.receiptNumber || 'N/A'}</code></td>
                    <td><code>${log.resultCode || 'N/A'}</code></td>
                    <td><button class="json-btn" onclick="showDetails('${log.id}')" title="View Raw JSON">📄</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filter(status) {
        currentFilter = status;
        document.querySelectorAll('.filters button[data-filter]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === status);
        });
        renderTable();
    }

    function refresh() {
        loadLogs();
        document.getElementById('statusText').textContent = '🔄 Refreshing...';
    }

    async function showDetails(id) {
        const log = logs.find(l => l.id === id);
        if (!log) return;

        const panel = document.getElementById('detailsPanel');
        const content = document.getElementById('detailsContent');
        const summary = document.getElementById('detailsSummary');

        try {
            const parsed = typeof log.rawJson === 'string' ? JSON.parse(log.rawJson) : log.rawJson;
            content.textContent = JSON.stringify(parsed, null, 2);
        } catch (e) {
            content.textContent = log.rawJson || JSON.stringify(log, null, 2);
        }

        summary.textContent = `📄 ${log.status} | ${log.checkoutId || 'N/A'} | ${log.timestamp}`;
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeDetails() {
        document.getElementById('detailsPanel').style.display = 'none';
    }

    async function clearLogs() {
        if (!confirm('Delete all webhook logs?')) return;
        try {
            await fetch(`${API_BASE}/api/webhook-dashboard/logs`, { method: 'DELETE' });
            await loadLogs();
        } catch (e) {
            console.error('Error clearing logs:', e);
        }
    }

    // Click outside to close details
    document.addEventListener('click', function(e) {
        const panel = document.getElementById('detailsPanel');
        if (panel.style.display === 'block' && !panel.contains(e.target) && !e.target.closest('.json-btn')) {
            closeDetails();
        }
    });

    document.querySelectorAll('.filters button[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => filter(btn.dataset.filter));
    });

    loadLogs();
    setInterval(loadLogs, refreshInterval);
</script>
</body>
</html>
